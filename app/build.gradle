plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jersus.codeeditor'
    compileSdk 23

    defaultConfig {
        applicationId "com.jersus.codeeditor"
        minSdk 23
        targetSdk 23
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O3"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}

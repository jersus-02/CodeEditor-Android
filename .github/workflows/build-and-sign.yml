name: Build Release APK

on:
  push:
    branches: [ "main" , "testing" ] # Triggers whenever you push changes to main
    release:
      types: [published]
  workflow_dispatch:     # Allows you to manually trigger this build anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Unsigned Release APK
      run: ./gradlew assembleRelease

    # Temporary: shows which build-tools versions exist on the runner.
    # If signing fails again, pick the highest number printed here and use it below. Delete this step when it works.
    - name: List build tools
      run: ls $ANDROID_HOME/build-tools

    - name: Sign Android Release APK
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CodeEditor-Signed-Release
        path: ${{ env.SIGNED_RELEASE_FILE }}

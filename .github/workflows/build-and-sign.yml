name: Build Release APK

on:
  push:
    branches: [ "main", "testing" ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    # 1. FIXED: Elevated token permissions to allow release creation and file attachments
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Unsigned Release APK
      run: ./gradlew assembleRelease

    - name: Sign Android Release APK
      id: sign_app
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.KEY_ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"

    # 2. FIXED: Upgraded to v7 and set archive to false to prevent zip compression
    - name: Upload Standard Artifact
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.sign_app.outputs.signedReleaseFile }}
        archive: false

    # 3. FIXED: This step will now successfully authenticate and push the unzipped APK to your release page
    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release' && github.event.action == 'published'
      with:
        files: ${{ steps.sign_app.outputs.signedReleaseFile }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
